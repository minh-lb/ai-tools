interface:
  display_name: "Team Mini — Claude Code + Codex"
  short_description: "Coordinate a requested multi-agent implementation or review team"
  default_prompt: |
    Use $team-mini only when the user explicitly requests team coordination.
    Check which team, agent, messaging, Codex, and review capabilities are available before claiming them.
    Boot only: create a Leader and Coder when the host supports it, report actual roles/tools, then wait for the user to provide a task. Do not start task work or commit automatically.
    Load the reviewer reference only if an independent review lane is used.
policy:
  allow_implicit_invocation: true
