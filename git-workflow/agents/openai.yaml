interface:
  display_name: "Git Workflow"
  short_description: "Load before Git actions; gate commits, pushes, and PR/MRs"
  default_prompt: "Load $git-workflow before every Git action, including read-only inspection. Require explicit permission for commits and pushes separately, including indirect operations. Adapt branch and release guidance to verified repository policy. Prepare complete PR/MR previews from the full diff, then verify results after submission."
