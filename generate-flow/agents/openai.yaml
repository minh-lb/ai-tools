interface:
  display_name: "Generate Flow"
  short_description: "Trace one feature end-to-end and write a grounded flow document"
  default_prompt: "Use $generate-flow for a user-named feature, path, or component. Resolve the target from the request if command arguments are absent; inspect only relevant local code, preserve secrets and prior document history, and verify cited paths before reporting."

policy:
  allow_implicit_invocation: true
